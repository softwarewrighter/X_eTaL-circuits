# Induction in GPT-2 Small: which heads does the output need? (Saga 2)
# Every value is a list of strings, read by Python (tomllib) and X_eTaL ([]L_IST).
#
# prompt       BOS + `length` distinct random tokens, then the same tokens again
# corruption   the twin keeps BOS and the first copy and replaces the second copy
#              with fresh tokens, so the two line up position by position
# metric       at each second-copy position, logit(clean next) - logit(twin next),

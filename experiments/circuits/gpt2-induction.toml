# A circuit to draw on the model map (just map). Every value is a list of
# strings. Heads are named layer.head by the model's numbers, from 0.
#
# Each head has an evidence level (head_evidence) and its basis (head_basis);
# each edge "a b" (a feeds b) has one (evidence). Levels:
#   observed   an attention pattern or attribution score only (dashed)
#   tested     an intervention moves the margin beyond matched random
#              controls, on the finding seeds (solid)
#   confirmed  also on the held-out seeds (thick)
# A head's level is the highest it reached under any intervention; the basis
# gives each method's verdict (just confirm fixtures/gpt2-induction
# fixtures/gpt2-induction-heldout; docs/design.md, D17, D18). Edges stay
# observed: ablating or patching a head tests the head, not which head feeds
# which (that takes path patching).
